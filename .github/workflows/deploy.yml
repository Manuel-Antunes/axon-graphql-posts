name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage de destino'
        type: string
        default: dev
        required: true
      args:
        description: 'Argumentos extras do `sst deploy` (--target, --exclude, --continue, --verbose)'
        type: string
        default: ''
        required: false

# Dois deploys no mesmo stage ao mesmo tempo disputam o lock de estado do SST, e o segundo encontra
# o do primeiro. `cancel-in-progress: false` porque cancelar um deploy no meio é pior que esperar.
concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read
  # A subaction `deploy-sst` cria um GitHub Deployment com o URL do router ao fim.
  deployments: write

jobs:
  deploy:
    name: deploy ${{ inputs.stage }}
    # O RUNNER É arm64, e isso NÃO é preferência — é a arquitetura do artefato.
    #
    # As seis funções declaram `architectures: ['arm64']` (`infra/aws/support/functions.ts`), e quem
    # produz o `bootstrap` é o builder image do Mandrel, que é MULTI-ARCH
    # (`linux/arm64` e `linux/amd64`). O Docker escolhe a variante pelo HOST, calado: num Mac Apple
    # Silicon sai aarch64 e tudo funciona; num `ubuntu-latest` (x86_64) sai amd64 e a função morre na
    # invocação com `Runtime.InvalidEntrypoint: failed to exec /var/task/bootstrap` — mensagem que
    # não menciona arquitetura em lugar nenhum.
    #
    # É a MESMA armadilha que o CLAUDE.md já registra para Mach-O vs ELF, um eixo adiante: lá era o
    # sistema operacional, aqui é a arquitetura, e o modo de falhar é idêntico — o build fica verde,
    # o zip publica e o binário não executa.
    #
    # `ubuntu-24.04-arm` é gratuito neste repositório porque ele é PÚBLICO.
    runs-on: ubuntu-24.04-arm
    # O deploy CONSTRÓI os quatro artefatos nativos, em série, dentro do builder image do Mandrel.
    timeout-minutes: 120
    environment: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./tools/github/deploy
        with:
          stage: ${{ inputs.stage }}
          args: ${{ inputs.args }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          better-stack-url: ${{ secrets.BETTER_STACK_URL }}
          better-stack-api-key: ${{ secrets.BETTER_STACK_API_KEY }}
