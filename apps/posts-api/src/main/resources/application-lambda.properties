# =============================================================================================
# O QUE MUDA QUANDO ISTO VIRA UM LAMBDA — E É SÓ ISTO
# =============================================================================================
# Este arquivo é ADITIVO. O `application.properties` ao lado não foi tocado: o Quarkus lê
# `application-<perfil>.properties` para cada perfil ativo e sobrepõe. Tudo que não está aqui
# continua valendo — o `validate` do Hibernate, o `migrate-at-start=false`, o teto de profundidade
# do GraphQL, a federação, os `subscribingprocessor.namespaces`, as exclusões de bean.
#
# COMO ATIVAR: `quarkus.profile=lambda,prod`, e nos DOIS momentos.
#   build time  -> vem do perfil Maven (`-Plambda-http` ou `-Plambda-sqs`), que declara a propriedade;
#   runtime     -> `QUARKUS_PROFILE=lambda,prod` na variável de ambiente da função.
# Esquecer o segundo é a armadilha: a função sobe com perfil `prod` sozinho, não lê este arquivo, e
# tenta falar RabbitMQ com um host que não existe. O sintoma é um timeout de conexão na partida.
#
# E são DOIS perfis e não um: `lambda` traz este arquivo, `prod` é o que mantém valendo as linhas
# `%prod.` do arquivo vizinho — datasource, issuer do Keycloak, endpoint do OTLP. Com `lambda`
# sozinho as três sumiriam em silêncio.

# ==== SAÍDA: o mesmo canal, outro conector ===================================================
# NADA de código mudou para esta linha existir. O `@AxonOutbox` de infrastructure/outbox continua
# dizendo `channel = "post-events-out"` e `namespaces = "posts"` — porque o que este serviço publica
# é contrato dele e não muda por ambiente. O que muda é o PARA ONDE, que é o que este arquivo diz.
#
# O `OutboxRouting` lê a linha abaixo, procura o `ChannelAddressing` que declara este conector e
# acha o `SnsAddressing` de libs/axon-aws. Era exatamente o que o Javadoc daquela interface previa:
# "Protocolo novo = uma ChannelAddressing a mais".
mp.messaging.outgoing.post-events-out.connector=smallrye-sns

# O topic FIFO é o exchange topic do RabbitMQ. `topic-arn` e não `topic` de propósito: com o nome o
# conector teria de RESOLVER o ARN na partida, o que custa uma chamada e a permissão de listar
# tópicos da conta. O ARN vem do IaC, que é quem o conhece.
# `topic.arn` com PONTO, e o nome foi lido do bytecode do conector — não da documentação.
# `topic-arn` com hífen é ignorado EM SILÊNCIO: o conector loga
#   SRMSG19504: Topic arn for channel post-events-out : null
# e a primeira publicação morre com
#   InvalidParameterException: Invalid parameter: TopicArn or TargetArn Reason: no value for required
# — que chega ao cliente como `System error` / `invalid-parameter`, sem nenhuma menção a configuração.
# (O `SnsConnectorCommonConfiguration` usa `topic`, `topic.arn`, `group.id`, `email.subject`.)
mp.messaging.outgoing.post-events-out.topic.arn=${AXONPOSTS_EVENTS_TOPIC_ARN}

# As linhas `exchange.*` do arquivo vizinho continuam lá e são IGNORADAS: o conector do SNS não as
# lê. Ficam porque removê-las exigiria editar aquele arquivo, e porque elas voltam a valer no dia em
# que este perfil não estiver ativo.

# ==== ENTRADA: o canal perde o broker, e ganha o Lambda ======================================
# `smallrye-in-memory` não é dublê de teste aqui: é o que permite ao `PostCompletionListener`
# continuar sendo a porta de entrada, com o `@Blocking(ordered = false)` dele e o
# `ChannelEventIngestion` atrás dele, sem uma linha alterada. Quem empurra a mensagem para dentro do
# canal é o `SqsChannelIngress`, chamado pelo handler do Lambda. Ver o Javadoc dele.
#
# As linhas `queue.*`, `exchange.*`, `routing-keys` e `failure-strategy` do arquivo vizinho também
# ficam e também são ignoradas. O que substituiu o `routing-keys` é a filter policy da subscription
# que alimenta esta fila — a mesma ideia, do outro lado do fio, declarada no IaC.
mp.messaging.incoming.post-completed-in.connector=smallrye-in-memory

# ==== IDENTIDADE: Cognito, e não o Keycloak ==================================================
# Em DEV e TESTE nada disto vale: lá o Dev Services sobe o Keycloak e importa o realm, e os 155
# testes continuam provando o que sempre provaram. Estas quatro linhas valem só no perfil `lambda`.
#
# ATENÇÃO: ESTAS DUAS LINHAS NÃO BASTAM, e descobrir isso custou um binário nativo implantado.
#
# Elas deveriam sobrepor as do arquivo vizinho — `quarkus.oidc.client-id=axon-posts-api` e
# `%prod.quarkus.oidc.auth-server-url`. Na JVM sobrepõem. No BINÁRIO NATIVO, não: a linha com prefixo
# de perfil (`%prod.`) do outro arquivo vence a linha SEM prefixo daqui, e a função sobe apontando
# para um Keycloak em `localhost`. Público responde, autenticado dá 500.
#
# Não é o arquivo que deixa de carregar — `axonposts.graphql.sse.keep-alive=2s`, aqui embaixo, vale
# em native (medido na stack: keep-alives a cada 2 s). É a precedência entre perfilada e não-perfilada
# que difere.
#
# Por isso `infra/aws/compute/environment.ts` passa `QUARKUS_OIDC_AUTH_SERVER_URL` e
# `QUARKUS_OIDC_CLIENT_ID` como variáveis de ambiente, que são ordinal 300 e ganham de qualquer
# arquivo nos dois empacotamentos. Estas duas ficam porque descrevem a intenção e valem na JVM; quem
# manda é o ambiente.
quarkus.oidc.auth-server-url=${OIDC_ISSUER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID}

# O `aud` do token TEM de ser conferido, e aqui isso não é zelo: o bearer é o ID TOKEN (ver o Javadoc
# de infra/aws/cognito.ts — o access token do Cognito não traz `email`, e o `UserProvisioning`
# exige um). Um ID token é emitido PARA UM CLIENT; sem conferir o `aud`, um token emitido para outro
# client do mesmo pool seria aceito aqui.
quarkus.oidc.token.audience=${OIDC_CLIENT_ID}

# O Cognito escreve os grupos em `cognito:groups`; o Keycloak escreve as roles em
# `realm_access.roles`, que o Quarkus já conhece por default. Esta linha é o que faz
# `@RolesAllowed(Role.AUTHOR_CLAIM)` continuar valendo SEM uma alteração na aplicação — os grupos do
# pool se chamam `author` e `user`, os mesmos literais do realm.
#
# É a única divergência de comportamento entre o que os testes provam e o que roda na AWS, e está
# escrita aqui em uma linha de propósito: se ela sumir, toda mutation de escrita passa a responder
# FORBIDDEN, e não há teste que pegue isso porque em teste o emissor é outro.
quarkus.oidc.roles.role-claim-path=cognito:groups

# ==== A função movida por fila (perfil Maven `lambda-sqs`) ===================================
# Esta aplicação tem UMA fila de entrada, então o canal é constante e está escrito aqui. No
# `apps/tagging`, que tem duas, o valor vem de variável de ambiente — uma função por fila.
#
# Estas duas linhas não têm efeito na função de API Gateway (`lambda-http`): lá não há handler de
# SQS para lê-las. Ficam no mesmo arquivo porque as duas funções são o mesmo perfil de configuração;
# o que as separa é o empacotamento, não a configuração.
axonposts.lambda.sqs.channel=post-completed-in
quarkus.lambda.handler=axon-sqs

# Quanto o handler espera pelo ack de um registro antes de devolvê-lo à fila. Tem de ser MENOR que o
# timeout da função — senão quem corta é a AWS, e aí não há `SQSBatchResponse` nenhum: o lote inteiro
# volta, inclusive o que já tinha sido processado.
axonposts.lambda.sqs.timeout=25s

# ==== Os clientes do AWS SDK =================================================================
# Região do ambiente: em Lambda, `AWS_REGION` sempre existe. O default só serve para uma execução
# local sem ambiente da AWS.
quarkus.sns.region=${AWS_REGION:us-east-1}
quarkus.sqs.region=${AWS_REGION:us-east-1}
# Netty porque é o que `netty-nio-client` (declarado em libs/axon-aws) oferece. Trocar por `aws-crt`
# — que tende a dar cold start menor — é esta linha mais a dependência correspondente.
quarkus.sns.async-client.type=netty
quarkus.sqs.async-client.type=netty
# Credenciais do papel de execução da função. É o default da cadeia do SDK; está escrito para que a
# ausência de chaves em configuração seja uma decisão visível e não um esquecimento.
quarkus.sns.aws.credentials.type=default
quarkus.sqs.aws.credentials.type=default

# ==== O que NÃO sobrevive a esta migração ====================================================
# A porta de SSE (interfaces/graphql/sse) e o WebSocket do SmallRye continuam compilados,
# registrados e inalcançáveis. O `quarkus-amazon-lambda-http` monta UM `APIGatewayV2HTTPResponse`
# inteiro em memória — conferido no JAR da 3.39.2, que não referencia
# `vnd.awslambda.http-integration-response` nem `RESPONSE_STREAM` —, e o API Gateway não faz
# response streaming em nenhum dos dois casos.
#
# E o transporte é a metade menor do problema: `SimpleQueryBus.emitUpdate` é EM PROCESSO. Quem apenda
# o `PostCreated` é a função de inbox; quem seguraria a conexão do assinante é a função de HTTP,
# outro ambiente de execução. Não há para onde emitir. Ver infra/aws/README.md.

# ==== O keep-alive do SSE, e por que ele é 2s aqui ===========================================
# O `SseStream` escreve o status ao abrir, mas o Vert.x só manda os CABEÇALHOS junto com o primeiro
# pedaço do corpo — e o primeiro pedaço é o comentário de keep-alive. Com o default de 15s, qualquer
# cliente que precise saber se o stream abriu (o proxy de `apps/web` precisa: é assim que ele decide
# entre repassar e emular) espera 15 segundos por uma resposta que já estava pronta.
#
# 2s resolve sem custo: um comentário SSE são três bytes, e a conexão já está aberta de qualquer jeito.
# Só vale no perfil `lambda` porque é aqui que há um intermediário decidindo com base nisso.
axonposts.graphql.sse.keep-alive=2s

