quarkus.application.name=quarkus-axon-graphql-posts

# ==== Read model: PostgreSQL ==========================================================
# Em dev e test, sem URL configurada, o Quarkus sobe um Postgres pelo Dev Services (Docker) e injeta a
# URL sozinho — é o que substitui, de uma vez, o `docker compose up` obrigatório antes de `spring-boot:run`
# e os Testcontainers escritos à mão da suíte. Para apontar para o Postgres do docker-compose em dev,
# passe -Dquarkus.datasource.jdbc.url=... (veja o README).
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/axonposts}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:axonposts}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:axonposts}

# validate, e não update: quem cria o schema é o Flyway. O Hibernate passa a CONFERIR que as entidades e
# as migrations dizem a mesma coisa, e a aplicação não sobe se divergirem — um campo novo sem migration
# vira erro na partida em vez de um ALTER TABLE silencioso.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
# Estatísticas do Hibernate: o BatchLoadingE2ETest conta PreparedStatements para provar que uma resposta
# com 5 posts custa o mesmo que uma com 1. Ligado aqui, e não num perfil de teste próprio, porque um
# perfil a mais faria a suíte pagar outra subida da aplicação.
%test.quarkus.hibernate-orm.statistics=true

# ==== Migrations ======================================================================
# FALSE, e esta é a linha mais consequente deste arquivo desde que o event store virou persistente.
#
# `migrate-at-start` perdeu a corrida da partida: `AxonExtension.init` é um recorder de RUNTIME_INIT
# que resolve o event storage engine e, ao fazê-lo, toca o EntityManager — construindo a persistence
# unit ANTES de o Flyway ter a vez. Com `strategy=validate` contra banco vazio a aplicação morre com
# `Schema validation: missing table [accounts]`. Adiar dentro do ComponentBuilder não resolve: a lambda
# é chamada de dentro do próprio init. Com o event store em memória isso nunca aparecia, porque o Axon
# não tocava JPA na partida.
#
# Quem cria o schema, então:
#   dev e teste  -> `db/init/schema.sql`, gerado das migrations pelo antrun e executado pelo Dev
#                   Services no `initdb` do container (ver a linha `init-script-path` abaixo);
#   compose/prod -> o serviço `flyway` do docker-compose, que roda ANTES da aplicação.
# É o que produção faria de qualquer jeito (init container / passo de deploy), e o gate do `validate`
# continua valendo, porque o script é gerado das próprias migrations.
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration

# O script que o container do Dev Services executa ao ser CRIADO. É gerado em `process-resources` pelo
# maven-antrun-plugin, concatenando `db/migration/V*.sql` em ordem — ver o comentário no pom.
# Roda uma vez por container, não por teste: o isolamento entre testes continua sendo o `truncate` do
# AbstractGraphQlE2ETest, que agora inclui as tabelas do Axon.
quarkus.datasource.devservices.init-script-path=db/init/schema.sql

# Deliberadamente FALSE: um banco não-vazio sem histórico é um banco que alguém criou por fora, e assumir
# uma baseline silenciosa esconderia justamente o problema que o Flyway existe para evitar. Vale para
# quem roda o Flyway — hoje o serviço `flyway` do compose, que herda esta configuração via variável.
quarkus.flyway.baseline-on-migrate=false
# E `clean-at-start` NÃO existe mais aqui: com `migrate-at-start=false` ele apagaria o schema que o
# script de inicialização acabou de criar e ninguém o recriaria. O isolamento entre testes é o
# `truncate` do AbstractGraphQlE2ETest.

# ==== Autenticação: resource server do realm do Keycloak ==============================
# Em dev e test o Dev Services do Keycloak sobe um container e importa ESTE realm — o mesmo arquivo que o
# docker-compose monta, que entra no classpath pelo <resources> do pom. Uma cópia só.
quarkus.keycloak.devservices.realm-path=realm-axon-posts.json
quarkus.keycloak.devservices.realm-name=axon-posts
quarkus.keycloak.devservices.create-realm=false
quarkus.oidc.client-id=axon-posts-api
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/axon-posts}

# A aplicação NÃO autentica toda requisição que chega. Um endpoint GraphQL é um caminho HTTP só, com
# operações públicas (post, posts) e privadas (me, createPost) no mesmo POST: autenticar por rota
# decidiria o mesmo para todas e bloquearia a introspecção. Quem autoriza é o método, pelo @RolesAllowed
# — exatamente a divisão `permitAll` + `@PreAuthorize` do projeto Spring.
quarkus.http.auth.proactive=false

# ==== GraphQL =========================================================================
# GraphiQL em http://localhost:8080/q/graphql-ui/ (ligado por padrão em dev/test)
quarkus.smallrye-graphql.root-path=/graphql
# O schema code-first servido como SDL em /graphql/schema.graphql — é por ele que geradores de cliente e
# o IDE enxergam PostConnection/PostEdge/PageInfo, que no projeto Spring precisavam ser escritos à mão
# num bloco gerado do .graphqls.
quarkus.smallrye-graphql.schema-available=true
# Mensagem de exceção não-checada só aparece para quem está listado aqui; o padrão ("System Error")
# continua valendo para todo o resto, que é o certo. São exatamente as quatro classificadas por
# GraphQlErrors — as exceções de segurança do Quarkus NÃO entram mais na lista, porque o
# ErrorTranslationInterceptor roda por fora dos interceptadores de segurança e as converte nestas aqui.
# Listá-las era o que publicava "message": null, já que elas não têm mensagem.
quarkus.smallrye-graphql.show-runtime-exception-message=dev.manuelantunes.axonposts.interfaces.graphql.error.BadRequestException,\
  dev.manuelantunes.axonposts.interfaces.graphql.error.UnauthorizedException,\
  dev.manuelantunes.axonposts.interfaces.graphql.error.ForbiddenException,\
  dev.manuelantunes.axonposts.interfaces.graphql.error.NotFoundException
quarkus.smallrye-graphql.error-extension-fields=code,classification
# Teto de profundidade da query. Precisa estar aqui porque o DEFAULT do SmallRye é 10 e 10 é baixo demais
# para este schema: a própria introspecção da GraphiQL tem profundidade 15, e `posts { edges { node {
# author { posts { edges { node { tags { edges { node { name` já são 11. Sem esta linha a UI sobe em
# branco com "maximum query depth exceeded 15 > 10" e nenhum cliente consegue gerar tipos.
# 20 mantém a defesa contra aninhamento patológico — que é o motivo de o teto existir — com folga para o
# mais fundo que o schema oferece. É o irmão do ConnectionArgs.MAX_LIMIT: um limite explícito e anotado.
quarkus.smallrye-graphql.instrumentation-query-depth=20
quarkus.smallrye-graphql.schema-include-scalars=true
# Diretivas no SDL servido em /graphql/schema.graphql. Com a federação ligada elas deixam de ser enfeite:
# @key e @shareable SÃO o contrato do subgraph, e um SDL que os esconde descreve outro schema.
quarkus.smallrye-graphql.schema-include-directives=true
# E o bloco `schema { ... }`, que só existe para carregar o @link da federação. Sem ele o SDL servido
# descreve os mesmos tipos mas SEM dizer de que versão da especificação eles falam — e um subgraph sem
# @link é lido como Federação 1 na composição. É a única diferença entre o arquivo servido aqui e o que
# `_service { sdl }` devolve.
quarkus.smallrye-graphql.schema-include-schema-definition=true

# ==== Federação (Apollo Federation 2) =================================================
# Esta aplicação é um SUBGRAPH: além do POST de sempre, ela responde `_service { sdl }` (o SDL que o
# roteador compõe) e `_entities(representations:)` (como o roteador reencontra um Post, uma Tag ou um
# usuário que outro subgraph só conhece pela chave). Quem serve os dois é o SmallRye; o que é daqui são
# as anotações nas views e os @Resolver em interfaces/graphql/api/*EntityApi.
#
# A linha abaixo é redundante hoje — a extensão liga a federação sozinha ao encontrar QUALQUER anotação
# de io.smallrye.graphql.api.federation no índice. Está escrita assim de propósito: ser subgraph é
# decisão do projeto, e não consequência de uma anotação que alguém pode remover sem perceber o que
# desligou junto.
quarkus.smallrye-graphql.federation.enabled=true

# DESLIGADO por default, e é o que separa uma resposta de `_entities` com N chaves de N idas ao banco.
# Ligado, o FederationDataFetcher procura primeiro um @Resolver que devolva LISTA do tipo e entrega o
# lote inteiro de uma vez; desligado, chama um método por representação — o N+1 de sempre, agora entre
# subgraphs. É o irmão, através do roteador, do que o @Source List<T> faz dentro do schema.
#
# O contrato do lote é verificado em runtime: uma posição por representação, na ordem recebida. Quem
# trava isso é o FederationEntitiesE2ETest, inclusive o custo (N representações = o mesmo número de
# statements que 1).
quarkus.smallrye-graphql.federation.batch-resolving-enabled=true

# Subscriptions sobre Server-Sent Events (interfaces/graphql/sse). O SmallRye só serve WebSocket, então
# esta porta é escrita aqui; ela negocia pelo Accept no MESMO /graphql e não muda nada do POST JSON.
# O keep-alive é um comentário SSE (":\n\n") periódico: o cliente descarta e o proxy conta como tráfego,
# que é o que impede um balanceador de derrubar uma subscription que passou minutos sem evento.
# Zero desliga o keep-alive.
axonposts.graphql.sse.keep-alive=15s
# Em teste o keep-alive é curto de propósito: o SseSubscriptions espera a PRIMEIRA linha vinda do
# servidor para saber que o stream já abriu antes de provocar o evento. Com 15s a suíte esperaria 15s.
%test.axonposts.graphql.sse.keep-alive=250ms

# ==== Log =============================================================================
quarkus.log.category."dev.manuelantunes.axonposts".level=DEBUG
quarkus.log.category."org.axonframework".level=INFO


# ==== Axon: a extensão de Quarkus ======================================================
# A configuração do Axon é da extensão (at.meks.quarkiverse.axonframework-extension). Ela descobre
# entidades e handlers em build time; o que NÃO dá para descobrir está em infrastructure/axon, num
# arquivo por decisão. Ver o README.

# Processor SUBSCRIBING, e é essa linha que o escolhe: sem nomear os namespaces aqui, NENHUM processor
# subscribing é criado e os handlers listados cairiam nos pooled (assíncronos). Subscribing é o que faz o
# handler rodar na mesma thread e na mesma transação de quem apendou o evento — é daí que vem a garantia
# que o resto do sistema usa sem saber: QUEM ENXERGA O EVENTO NO STORE ENXERGA A LINHA.
#
# O que roda aqui são as PROJEÇÕES, e só elas: o que precisa ser gravado uma vez, junto com o append, e
# que aborta o append se falhar. Quem NOTIFICA os assinantes está em `application.post.event` e roda
# noutro processor de propósito — ver o bloco logo abaixo. As duas reações querem entregas opostas, e o
# pacote é o que escolhe cada uma.
#
# O valor é o PACOTE: a extensão lê @Namespace da classe e cai no nome do pacote como default, então uma
# projeção nova em application.post.projection continua entrando sem tocar em configuração.
#
# PACOTE NOVO DE EVENT HANDLER = MAIS UM ITEM AQUI (ou no pooled abaixo), separado por vírgula. Quem fica
# de fora não dá erro: vai para um PooledStreamingEventProcessor ANÔNIMO, assíncrono e com token store
# JPA, e a garantia acima deixa de valer sem ninguém ter pedido. Quem pega isso é o
# AxonWiringTest.everyPackageWithAnEventHandlerIsAssignedToAProcessor.
# A ordem importa: escreva o primeiro handler do pacote ANTES de listá-lo. Namespace listado sem nenhum
# handler faz a aplicação NÃO SUBIR, com NullPointerException na partida.
quarkus.axon.subscribingprocessor.namespaces=dev.manuelantunes.axonposts.application.post.projection

# E o pacote da saga entra SÓ EM TESTE, porque só em teste ele tem handler.
#
# O `InProcessTagAssignment` é o serviço de tagueamento dublado dentro do processo, e ele é removido do
# build em dev e prod pelo `@IfBuildProperty` — lá quem decide a tag é `apps/tagging`. Listar o
# namespace mesmo assim derruba a aplicação na partida, com uma NullPointerException nua:
#
#   Failed to start quarkus / Caused by: java.lang.NullPointerException
#
# É a armadilha que este arquivo já documentava ("namespace listado sem nenhum handler faz a aplicação
# NÃO SUBIR") — a extensão faz `map(mapa::get).flatMap(...)` sobre um `null`. Medido: a suíte inteira
# verde, com 149 testes, e a aplicação empacotada não subindo. Nenhum teste pega isso, porque em teste o
# bean existe.
#
# As duas linhas andam juntas: se o dublê deixar de ser `%test`-only, esta linha muda com ele.
%test.quarkus.axon.subscribingprocessor.namespaces=\
  dev.manuelantunes.axonposts.application.post.projection,\
  dev.manuelantunes.axonposts.application.post.saga
quarkus.axon.subscribingprocessor.name=post-projection

# =============================================================================================
# O PROCESSOR QUE AVISA OS ASSINANTES — e por que ele NÃO pode ser subscribing
# =============================================================================================
# Um processor `subscribing` dispara quando o evento é apendado NESTE processo. Isso basta enquanto
# há um processo, e deixa de bastar no instante em que há dois — o que em Lambda é sempre: quem
# segura a conexão SSE está numa invocação que não retornou, então a mutation seguinte cai
# obrigatoriamente noutro container. Medido contra a stack, com o response streaming já funcionando:
# assinar `onPostUpdated`, criar e editar um post não entregou evento nenhum.
#
# A correção não é código: são estas três linhas. `application.post.event` — os
# PostCreatedEventHandler / PostUpdatedEventHandler, com o QueryUpdateEmitter injetado por parâmetro,
# na mesma forma da versão Spring — roda num PooledStreamingEventProcessor, que lê o EVENT STORE, o
# único lugar que todos os containers enxergam. Quem faz a leitura, o cursor, o lote e o retry é o
# Axon, com o EventStorageEngine e o TokenStore que esta aplicação já configura. Não há consulta
# escrita à mão em lugar nenhum, e os handlers não sabem em que processor estão.
#
# EVENTO NOVO COM SUBSCRIPTION = uma classe a mais em application.post.event. Nada aqui muda.
quarkus.axon.pooledprocessor.post-subscriptions.namespaces=dev.manuelantunes.axonposts.application.post.event

# TOKEN STORE EM MEMÓRIA, e esta é a linha que decide tudo.
#
# O default é o token store JPA, e ele faz exatamente o OPOSTO do que um fan-out precisa: ele existe
# para garantir que um evento seja processado UMA vez no cluster inteiro, então um container reclama
# o segmento e os outros ficam sem ver nada. Aqui a regra é inversa — TODO container precisa ver TODO
# evento, porque cada um tem os seus próprios assinantes na memória.
#
# Em memória, cada container tem o próprio cursor, ninguém reclama nada de ninguém, e não sobra linha
# em `tokenentry` para um container que morreu. Nada se perde no caminho: o que este processor faz é
# notificar quem está conectado AGORA; um aviso que ninguém estava ouvindo não tem o que ser retomado.
quarkus.axon.pooledprocessor.post-subscriptions.use-in-memory-token-store=true

# E começa no HEAD: um container que sobe agora quer o que vier a partir de agora. Com TAIL ele
# reemitiria o histórico inteiro para assinantes que acabaram de chegar — cada deploy viraria uma
# avalanche de notificações de posts antigos.
quarkus.axon.pooledprocessor.post-subscriptions.initial-position.at-head-or-tail=HEAD

quarkus.axon.axon-application-name=quarkus-axon-graphql-posts
# Desliga o "update check" do Axon, que é uma chamada de rede na partida mais um relatório no log a cada
# execução — inclusive em cada teste. Numa POC não há o que atualizar.
quarkus.axon.update-check.disabled=true

# Event store: NENHUMA linha. O default da extensão é o em memória, que é justamente a escolha deste
# projeto — trocar por Postgres é acrescentar a dependência quarkus-axon-jpa-eventstore, e nada mais.


# OS SPANS DE GRAPHQL — uma linha, e ela é a diferença entre ver a operação e ver só o POST.
#
# O SmallRye traz um `TracingService` próprio, em `smallrye-graphql-cdi`, que fala a API do
# OpenTelemetry direto. Ele é um `EventingService`, descoberto por ServiceLoader, e é GATEADO por
# `smallrye.graphql.tracing.enabled` — desligado, nada acontece e nada avisa.
#
# O que se ganha: um span por OPERAÇÃO, com o nome dela, por dentro do `POST /graphql`. Sem ele o
# trace mostra um POST de 300 ms e não diz qual query os gastou.
#
# E o registro para o binário nativo vem de graça: o `SmallRyeGraphQLProcessor` do Quarkus tem um
# `activateTracing` que emite o `ServiceProviderBuildItem` quando esta propriedade está ligada. Houve
# aqui um `@RegisterForReflection` à mão mais um `quarkus.native.resources.includes`; os dois saíram
# quando isso foi conferido no bytecode da extensão.
quarkus.smallrye-graphql.tracing.enabled=true

# ==== OpenTelemetry ===================================================================
# Traces já vêm ligados; logs e métricas NÃO — os dois são `false` por default no Quarkus, então
# estas duas linhas são o que faz o sinal existir, não afinamento.
quarkus.otel.logs.enabled=true
quarkus.otel.metrics.enabled=true

# Em prod o endereço vem do ambiente, no mesmo padrão do datasource e do issuer do Keycloak; o
# default é o OTLP/gRPC canônico. Em DEV não há linha de endpoint de propósito: o Dev Services do
# LGTM sobe o container e aponta o exportador para ele sozinho.
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# O nome do serviço no Grafana é o `quarkus.application.name` lá de cima — sem ele todo trace chega
# como "unknown_service", e com um subgraph atrás de um router isso inutiliza o trace distribuído.

# Porta fixa da Grafana. Sem isto o Dev Services sorteia uma porta a cada partida e a URL muda toda
# vez; 3001 e não 3000 porque 3000 é o default de metade das ferramentas de dev.
quarkus.observability.lgtm.grafana-port=3001

# ==== Observabilidade em TESTE: desligada de propósito ================================
# Duas razões, e as duas são medidas: (1) subir Loki+Grafana+Tempo+Mimir por suíte custa memória de
# Docker que esta máquina não tem sobrando — Postgres e Keycloak do Dev Services já estão lá; (2) com
# o SDK ligado e sem coletor, todo teste paga tentativa de exportação e enche o log de falha de
# conexão. `sdk.disabled` desliga a instrumentação inteira, não só o exportador.
%test.quarkus.observability.enabled=false
%test.quarkus.otel.sdk.disabled=true
# Com o SDK desligado, a API do OTel vira no-op e avisa uma vez por suíte que foi chamada sem SDK.
# É a consequência esperada da linha acima, não um defeito — calada só em teste.
%test.quarkus.log.category."io.opentelemetry.usage".level=OFF

# ==== Event store e token store: PERSISTENTES =========================================
# Nenhuma linha de configuração aqui — quem escolhe é o POM. Com `quarkus-axon-jpa-eventstore` e
# `quarkus-axon-tokenstore-jpa` no classpath, a extensão troca os defaults em memória pelos de JPA, e
# as tabelas vêm da V2.
#
# POR QUE DEIXOU DE SER ACEITÁVEL SER EM MEMÓRIA
# ==============================================
# Porque a saga de tagueamento passou a ser coreografada entre DOIS serviços. Um passo intermediário
# (`PostPreCreated` publicado, decisão de tag ainda não voltada) que vive só na memória de um processo
# desaparece no restart dele, e o post fica pré-criado para sempre — sem erro, sem retry, sem ninguém
# saber. Event store durável é o que transforma "a saga parou" em "a saga retoma".

# ==== Axon ↔ channels do Quarkus: a INTEGRAÇÃO COMPLETA ==============================
# Duas metades, e a segunda é a que mudou tudo:
#
#   SAÍDA    todo evento apendado no event store é oferecido aos OUTBOXES deste serviço, depois do
#            commit, e sai por aqueles cujo seletor o casa. Genérico: nenhum tipo de evento é citado em
#            código nenhum. Evento novo de um namespace já publicado já sai roteado.
#
#   ENTRADA  toda mensagem recebida do channel é APENDADA NO EVENT STORE LOCAL, e é o store — não a
#            fila — que alimenta os event processors.
#
# A entrada era diferente: a fila alimentava um SubscribingEventProcessor direto. Funcionava e custava
# três coisas estruturais — sem token, sem replay, sem durabilidade deste lado —, além de travar a
# entrega depois da primeira mensagem. Apendando no store, o broker volta a ser só transporte e o Axon
# funciona como em qualquer aplicação sem mensageria. Ver o Javadoc de `ChannelEventInbox`.
#
# O interruptor geral. Desligado, nada é encaminhado e a aplicação não publica no broker.
axonposts.messaging.publish-events=true

# ==== SAÍDA: UM CANAL POR DESTINO =====================================================
# Não existe mais um canal "manda tudo" — havia um, `axon-events`, e ele obrigava todo evento a sair pelo
# mesmo lugar, no mesmo protocolo, para quem quer que estivesse vinculado. Era um ponto central numa saga
# que se diz coreografada.
#
# O que sai por cada canal NÃO está neste arquivo: está no `@AxonOutbox` do produtor — ver o bloco logo
# abaixo das linhas do conector.
#
# QUEM DECLARA O @Channel É UM PRODUTOR DO SERVIÇO (infrastructure/outbox/PostEventsOutbox,
# anotado @AxonOutbox), e não é opcional: o SmallRye só cria emitter para @Channel visto em BUILD TIME. Este bloco sozinho liga o
# canal ao broker sem ninguém para alimentá-lo, e o único sinal é um `has no downstream` no meio da
# partida — que é justamente o caso que o OutboxRouting NÃO pega, porque nem todo canal outgoing
# precisa ser um outbox do Axon. O inverso ele pega: bean declarando canal que o SmallRye não ligou
# derruba a resolução da tabela, com o nome do canal no erro.
#
# DESTINO NOVO = um AxonOutbox + um bloco destes. Em OUTRO PROTOCOLO, idem: o conector é atributo do
# canal, então `smallrye-kafka` num e `smallrye-rabbitmq` noutro convivem no mesmo serviço, e quem
# endereça cada um é o ChannelAddressing que declara aquele conector. Era isso que o canal único tornava
# inexprimível.
mp.messaging.outgoing.post-events-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.post-events-out.exchange.name=axonposts.events
mp.messaging.outgoing.post-events-out.exchange.type=topic
mp.messaging.outgoing.post-events-out.exchange.declare=true

# NÃO HÁ LINHA DE "O QUE SAI" AQUI, e a ausência é a decisão: quem declara isso é o bean, em
# `@AxonOutbox(namespaces = ...)`. Houve uma propriedade (`axonposts.messaging.outbox.<canal>.events`, globs
# sobre `namespace.Name`), escrita para espelhar o `routing-keys` da entrada — e a simetria era
# aparente. Lá o seletor é mesmo configuração, porque anda junto com nome de fila e binding, que mudam
# por ambiente; aqui não muda por ambiente nunca. O que um serviço publica é CONTRATO dele, e contrato
# que mora em .properties é contrato que se altera sem passar por revisão de código.
#
# A linha ficou: o CÓDIGO diz o quê, ESTE ARQUIVO diz para onde.
#
# A chave de ordenação — o terceiro segmento da routing key — também saiu daqui. Era
# `axonposts.messaging.ordering-tag-keys=postId,tagAssignment,tagId,userId`, e este arquivo já admitia
# que ela não desempatava nada: o event store em aggregate mode aceita UMA tag por evento, então não há
# empate. Hoje a chave é a tag do evento, lida do próprio evento — ver EventAddress.

# ==== ENTRADA: UM CANAL POR PROPÓSITO =================================================
# Não existe um canal "pega tudo". Cada fatia que esta máquina ingere tem canal, fila e binding
# próprios, e um listener declarado no código (`infrastructure/messaging`). O que isso compra:
#   * ISOLAMENTO DE FALHA — mensagem-veneno de um tipo não é rejeitada junto com o fluxo dos outros;
#   * VAZÃO POR FATIA — dá para escalar ou pausar um fluxo sem tocar no resto;
#   * TOPOLOGIA LEGÍVEL — `rabbitmqctl list_bindings` passa a DESCREVER o sistema.
#
# FILA POR SERVIÇO continua valendo, e por outra razão: no RabbitMQ a cópia é por fila vinculada, não
# por consumidor. Duas aplicações na mesma fila COMPETEM pelas mensagens, e a que descarta dá ack e mata
# a mensagem da outra. Medido nesta base: 274 eventos publicados, 1 entregue.

# --- a VOLTA da saga: o post voltando completo de quem decidiu a tag (PostCompletionListener)
mp.messaging.incoming.post-completed-in.connector=smallrye-rabbitmq
mp.messaging.incoming.post-completed-in.queue.name=axonposts.posts-api.post-completed
mp.messaging.incoming.post-completed-in.queue.declare=true
mp.messaging.incoming.post-completed-in.exchange.name=axonposts.events
mp.messaging.incoming.post-completed-in.exchange.type=topic
mp.messaging.incoming.post-completed-in.exchange.declare=true
# Esta aplicação publica `posts.PostPreCreated` e escuta `posts.PostCreated`: são eventos do MESMO
# agregado, o que é o correto quando dois serviços tocam o ciclo de vida dele. Quem impede o laço é a
# marca de origem, não a binding — o evento que este serviço mesmo publicou é descartado sem ser
# apendado. A routing key tem três segmentos (`namespace.Name.tagDoAgregado`), daí o `*` no fim.
mp.messaging.incoming.post-completed-in.routing-keys=posts.PostCreated.*
# `reject` em vez de `requeue`: mensagem-veneno com requeue gira em laço eterno. Rejeitada, ela sai da
# fila — e o que a torna recuperável não é o requeue, é o event store de quem a publicou.
mp.messaging.incoming.post-completed-in.failure-strategy=reject

# Em dev e teste o broker vem do Dev Services, como Postgres e Keycloak. Em prod, do ambiente.
%prod.rabbitmq-host=${RABBITMQ_HOST:localhost}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USERNAME:axonposts}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD:axonposts}

# ==== QUEM DECIDE A PRIMEIRA TAG ======================================================
# Em dev e prod: OUTRO SERVIÇO (apps/consumer). Esta aplicação publica `posts.PostPreCreated` e espera
# `tagging.DefaultTagAssigned` voltar. O post responde na versão 1, sem tag, e fica completo depois.
#
# Em TESTE: o próprio processo, pelo `InProcessTagAssignment` — e isto é DUBLAGEM declarada, não um
# segundo caminho de produção. A propriedade é lida em BUILD TIME (`@IfBuildProperty`), então em dev e
# prod a classe nem entra no build.
#
# Por que dublar em vez de deixar a suíte falar com o broker: consistência eventual faz mensagem em voo
# CRUZAR a fronteira do teste. A suíte isola cada método com `truncate`, então um post criado no teste N
# recebe a tag depois de o teste N+1 ter limpado o banco. Medido: 54 eventos publicados, 36 entregues,
# 6 CommandExecutionException e sete testes estourando espera.
#
# O caminho real é coberto fora do Surefire, subindo as duas aplicações de verdade — onde não há
# ninguém com quem disputar isolamento. Ver `docker/e2e/`.
axonposts.saga.tagging-in-process=false
%test.axonposts.saga.tagging-in-process=true

# ==== UMA exclusão de bean, por ambiguidade ===========================================
# 1. `QuarkusAxonEntityManagerProvider`: `quarkus-axon-jpa-eventstore` e `quarkus-axon-tokenstore-jpa`
#    declaram CADA UM uma classe com esse nome, as duas `@ApplicationScoped` e nenhuma `@DefaultBean`.
#    Com os dois módulos no pom o ArC acha duas implementações de `EntityManagerProvider` e a partida
#    morre com `AmbiguousResolutionException`. As duas devolvem o EntityManager da persistence unit
#    default, então excluir uma é só escolher qual sobra — e sobra a do token store, porque excluir a
#    do event store foi o que funcionou quando medido.
#
# HAVIA UMA SEGUNDA, e ela VOLTOU ATRÁS. Ficou aqui porque a razão dela era boa e a correção é melhor.
#
# `PooledEventProcessingConfigurer` estava excluído com este argumento: "não é o que este projeto quer
# em lugar nenhum — a projeção é subscribing de propósito". Medido na época: o namespace da saga ganhou
# um processor pooled, tentou reclamar um token não inicializado (`UnableToClaimTokenException`) e
# poluiu a contagem de statements do BatchLoadingE2ETest com escritas concorrentes.
#
# O problema: excluir o bean não desliga um acidente, desliga a CAPACIDADE. Enquanto ele esteve fora,
# um namespace esquecido em `subscribingprocessor.namespaces` não virava um processor assíncrono —
# virava NENHUM processor, e os handlers dele nunca rodavam, sem um aviso em lugar nenhum. O comentário
# acima descrevia um comportamento que esta aplicação não tinha mais.
#
# E passou a ser necessário: o `post-subscriptions` (ver o bloco de processors mais acima) PRECISA ser
# pooled, porque só um processor streaming lê o event store — o único lugar que todos os containers
# enxergam. Sem ele, subscription não funciona com mais de uma instância, que em Lambda é sempre.
#
# O que protege contra o acidente original agora é um teste, e não a ausência de um bean:
# `AxonWiringTest.everyPackageWithAnEventHandlerIsAssignedToAProcessor` exige que todo pacote com
# `@EventHandler` esteja declarado no processor subscribing OU num pooled nomeado. Um namespace
# esquecido falha o build em vez de escolher um default em silêncio — que é a proteção que se queria.
quarkus.arc.exclude-types=\
  at.meks.quarkiverse.axon.eventstore.jpa.runtime.QuarkusAxonEntityManagerProvider
