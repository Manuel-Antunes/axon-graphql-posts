# =============================================================================================
# O QUE MUDA QUANDO ISTO VIRA UM LAMBDA — E É SÓ ISTO
# =============================================================================================
# Aditivo: o `application.properties` ao lado não foi tocado. Continua valendo tudo que não está
# aqui — o `quarkus.hibernate-orm.packages=org.axonframework` que é o que torna viável importar o
# domínio de posts sem o banco dele, o `subscribingprocessor`, a exclusão do
# `PooledEventProcessingConfigurer`.
#
# COMO ATIVAR: `quarkus.profile=lambda,prod`, no build (perfil Maven `-Plambda`) E no runtime
# (`QUARKUS_PROFILE=lambda,prod` na função). Esquecer o segundo faz a função subir em `prod` puro,
# ignorar este arquivo e tentar falar RabbitMQ.

# ==== SAÍDA: o mesmo canal, outro conector ===================================================
# O `@AxonOutbox` deste serviço não mudou: `channel = "post-events-out"`, `namespaces = "posts"`.
# Ele continua publicando um evento do agregado POST, no namespace `posts`, no MESMO topic do outro
# serviço — como publicava no mesmo exchange. Nenhum dos dois nomeia o outro; quem reage é problema
# de quem reage, e agora isso é uma filter policy.
mp.messaging.outgoing.post-events-out.connector=smallrye-sns
# `topic.arn` com PONTO, e o nome foi lido do bytecode do conector — não da documentação.
# `topic-arn` com hífen é ignorado EM SILÊNCIO: o conector loga
#   SRMSG19504: Topic arn for channel post-events-out : null
# e a primeira publicação morre com
#   InvalidParameterException: Invalid parameter: TopicArn or TargetArn Reason: no value for required
# — que chega ao cliente como `System error` / `invalid-parameter`, sem nenhuma menção a configuração.
# (O `SnsConnectorCommonConfiguration` usa `topic`, `topic.arn`, `group.id`, `email.subject`.)
mp.messaging.outgoing.post-events-out.topic.arn=${AXONPOSTS_EVENTS_TOPIC_ARN}

# ==== ENTRADA: DOIS canais, e uma FUNÇÃO PARA CADA ===========================================
# Os dois canais continuam declarados, e os dois `@Incoming` continuam sem uma linha alterada. O que
# mudou é que cada função só alimenta UM deles — o que `AXONPOSTS_LAMBDA_SQS_CHANNEL` disser — e o
# outro fica ligado e ocioso.
#
# POR QUE DUAS FUNÇÕES, E NÃO UMA COM DUAS FILAS
# A mesma razão pela qual as filas são duas, que já está escrita no arquivo vizinho: mensagem-veneno
# de atualização não pode ser rejeitada junto com as decisões pendentes, e escalar um fluxo não pode
# mexer no outro. Numa função só os dois voltariam a dividir concorrência, DLQ e throttle — e a
# separação teria sido desfeita em runtime depois de comprada na topologia.
#
# A consequência boa: sem duas filas na mesma função, não há o que rotear dentro do processo. O
# roteamento inteiro vira filter policy no IaC, e daqui só sai qual canal esta função serve.
mp.messaging.incoming.post-precreated-in.connector=smallrye-in-memory
mp.messaging.incoming.post-changes-in.connector=smallrye-in-memory

# Vem do ambiente, posto pelo IaC. `post-precreated-in` numa função, `post-changes-in` na outra.
# (A linha é redundante — o MicroProfile Config já mapeia a variável de ambiente para esta chave
# sozinho. Está escrita para o contrato entre o IaC e a aplicação ficar VISÍVEL neste arquivo, em
# vez de existir só na convenção de maiúsculas.)
axonposts.lambda.sqs.channel=${AXONPOSTS_LAMBDA_SQS_CHANNEL}
quarkus.lambda.handler=axon-sqs

# Menor que o timeout da função, senão quem corta é a AWS — e aí o lote inteiro volta, inclusive o
# que já foi processado, porque não há `SQSBatchResponse` para devolver.
axonposts.lambda.sqs.timeout=25s

# ==== Os clientes do AWS SDK =================================================================
quarkus.sns.region=${AWS_REGION:us-east-1}
quarkus.sqs.region=${AWS_REGION:us-east-1}
quarkus.sns.async-client.type=netty
quarkus.sqs.async-client.type=netty
quarkus.sns.aws.credentials.type=default
quarkus.sqs.aws.credentials.type=default

