quarkus.application.name=axonposts-tagging

# Sem porta HTTP, e sem extensão de HTTP no pom. Este serviço não é consultado por ninguém: o que o
# aciona é mensagem e o que ele produz é mensagem. O que o mantém no ar é o conector de mensageria.
#
# A versão anterior deste módulo tinha porta e um endpoint `GET /received` — e ele existia só para o
# teste perguntar "o que você recebeu?". Isso era o teste olhando para o lugar errado: o que prova que a
# saga funciona é o `onPostCreated` do outro serviço chegar completo, não este confessar.

# ==== O event store DESTE serviço =====================================================
# Banco próprio, e não um schema no banco do outro: event store compartilhado é acoplamento pela porta
# dos fundos — dois serviços no mesmo store podem ler o stream um do outro sem passar por contrato
# nenhum. Ver o comentário na V1.
#
# O banco `axonposts_tagging` é criado pelo `docker/postgres/init/02-tagging-database.sql`; em dev e
# teste, pelo Dev Services (que cria um banco por aplicação sozinho).
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/axonposts_tagging}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:axonposts}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:axonposts}

# validate, pela mesma razão do outro serviço: as entidades do Axon estão no classpath e o schema vem da
# migration. Divergência derruba a partida em vez de virar um ALTER TABLE silencioso.
quarkus.hibernate-orm.schema-management.strategy=validate

# SÓ as entidades do Axon entram nesta persistence unit, e esta linha é o que torna viável importar o
# domínio de posts sem importar o banco dele.
#
# `libs/posts` traz `Post`, `Tag`, `User`, `Author` e `Reader` no classpath — todas @Entity,
# porque neste projeto o agregado e a linha do read model são a mesma classe. Sem esta restrição o
# Hibernate as adotaria e o `validate` exigiria `posts`, `tags`, `post_tags`, `users`, `authors` e
# `accounts` AQUI, num serviço que não tem read model nenhum e não precisa de nenhuma delas.
#
# O que este serviço faz com aquelas classes é reidratá-las do EVENT STORE e aplicar regra de domínio.
# Isso não passa por JPA em momento nenhum — nenhum `save`, nenhuma query.
quarkus.hibernate-orm.packages=org.axonframework

# FALSE, pelo mesmo motivo medido no serviço de posts: `AxonExtension.init` é um recorder de RUNTIME_INIT
# que toca o EntityManager antes de o Flyway ter a vez, e com `validate` contra banco vazio a aplicação
# morre na partida. Quem cria o schema é o serviço `flyway-tagging` do compose, que roda antes.
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=false

# Em dev e teste, o schema vem daqui: o script é gerado das migrations pelo antrun e executado pelo Dev
# Services ao CRIAR o container.
quarkus.datasource.devservices.init-script-path=db/init/schema.sql

# ==== Axon =============================================================================
quarkus.axon.axon-application-name=axonposts-tagging
quarkus.axon.update-check.disabled=true

# O processor é SUBSCRIBING: o handler roda na mesma thread e na mesma transação do append do evento
# ingerido. É o que faz a decisão de tagueamento e o registro de recebimento commitarem juntos.
#
# PACOTE NOVO DE EVENT HANDLER = mais um item aqui. Quem fica de fora não dá erro: vai para um processor
# pooled, assíncrono, sem ninguém pedir. E a ordem importa — namespace listado sem nenhum handler faz a
# aplicação NÃO SUBIR, com NullPointerException na partida.
quarkus.axon.subscribingprocessor.namespaces=dev.manuelantunes.axonposts.tagging.application
quarkus.axon.subscribingprocessor.name=tag-decision

# UMA exclusão só, e não duas como no outro serviço: a colisão dos dois `QuarkusAxonEntityManagerProvider`
# não existe aqui porque o token store JPA não está no pom — ver o comentário dele.
#
# O `PooledEventProcessingConfigurer` é `@ApplicationScoped` e NÃO `@DefaultBean`: sem excluí-lo, todo
# namespace fora de `subscribingprocessor.namespaces` ganha um processor pooled, assíncrono e com token
# — num serviço que nem tem token store. Este é o único serviço onde essa exclusão também evita um erro
# de partida, não só um comportamento indesejado.
quarkus.arc.exclude-types=at.meks.quarkiverse.axon.runtime.defaults.eventprocessors.PooledEventProcessingConfigurer

# ==== A integração: as duas metades ====================================================
axonposts.messaging.publish-events=true

# SAÍDA: o `posts.PostCreated` que este serviço apendou ao completar o post, no MESMO exchange do
# outro serviço. Quem reage é problema de quem reage — este serviço não sabe que alguém escuta.
#
# Note que ele publica um evento do agregado POST, no namespace `posts`: o fato é do Post, e quem o
# decidiu foi este serviço. É o que "o ciclo de vida do post tocado por dois serviços" significa na
# prática, e o que mantém isso honesto é o evento ser o do agregado, não uma invenção local.
mp.messaging.outgoing.axon-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.axon-events.exchange.name=axonposts.events
mp.messaging.outgoing.axon-events.exchange.type=topic
mp.messaging.outgoing.axon-events.exchange.declare=true

# `postId` primeiro: é a tag do Post, e é ela que identifica a instância na routing key
# (`posts.PostCreated.<postId>`). Hoje todo evento tem uma tag só — o event store em aggregate mode não
# aceita duas —, então a lista não desempata nada; ela fica porque o mecanismo é o que importa.
axonposts.messaging.ordering-tag-keys=postId,tagId,userId

# ==== ENTRADA: UM CANAL POR PROPÓSITO =================================================
# Dois canais, com exigências diferentes — e é por isso que são dois, e não um com quatro routing keys.
#
# FILA POR SERVIÇO continua valendo por cima disso: no RabbitMQ a cópia é por fila vinculada, não por
# consumidor. Compartilhar fila com o outro serviço faria os dois COMPETIREM pelas mensagens, e quem
# descarta dá ack e mata a mensagem do outro. Medido: 274 eventos publicados, 1 entregue.

# --- (1) onde este serviço AGE: um post nasceu sem tag (PostPreCreatedListener)
# Cada mensagem aqui vira uma decisão e um evento publicado. Falha nesta fila precisa ser vista.
mp.messaging.incoming.post-precreated-in.connector=smallrye-rabbitmq
mp.messaging.incoming.post-precreated-in.queue.name=axonposts.tagging.post-precreated
mp.messaging.incoming.post-precreated-in.queue.declare=true
mp.messaging.incoming.post-precreated-in.exchange.name=axonposts.events
mp.messaging.incoming.post-precreated-in.exchange.type=topic
mp.messaging.incoming.post-precreated-in.exchange.declare=true
mp.messaging.incoming.post-precreated-in.routing-keys=posts.PostPreCreated.*
mp.messaging.incoming.post-precreated-in.failure-strategy=reject

# --- (2) onde este serviço só REPLICA: o resto do ciclo de vida do Post (PostChangesListener)
# Nenhum handler reage a estes eventos. Eles existem para o stream do Post ficar COMPLETO neste store —
# e isso não é zelo: este serviço ESCREVE no stream do Post (é ele que apenda o `PostCreated`), e num
# event store em aggregate mode a posição de um append vem de ter lido o stream antes. Faltando eventos,
# a leitura devolve menos do que existe e o append seguinte colide:
#   duplicate key value violates unique constraint "uk_aggregateevententry_aggregate"
#
# EVENTO NOVO NO CICLO DE VIDA DO POST = mais uma routing key aqui. Esquecer não quebra na hora: quebra
# no próximo append deste serviço àquele agregado, longe da causa.
#
# `PostPreCreated` não está na lista porque vem pelo canal (1), que ACIONA trabalho. `PostCreated`
# também não: é este serviço que o publica, e a marca de origem o descartaria.
mp.messaging.incoming.post-changes-in.connector=smallrye-rabbitmq
mp.messaging.incoming.post-changes-in.queue.name=axonposts.tagging.post-changes
mp.messaging.incoming.post-changes-in.queue.declare=true
mp.messaging.incoming.post-changes-in.exchange.name=axonposts.events
mp.messaging.incoming.post-changes-in.exchange.type=topic
mp.messaging.incoming.post-changes-in.exchange.declare=true
mp.messaging.incoming.post-changes-in.routing-keys=posts.PostUpdated.*,posts.PostDeleted.*,posts.PostRestored.*
mp.messaging.incoming.post-changes-in.failure-strategy=reject

%prod.rabbitmq-host=${RABBITMQ_HOST:localhost}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USERNAME:guest}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# ==== Log ==============================================================================
quarkus.log.category."dev.manuelantunes.axonposts".level=DEBUG
quarkus.log.category."org.axonframework".level=INFO
