quarkus.application.name=axonposts-tagging

quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/axonposts_tagging}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:axonposts}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:axonposts}

quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.hibernate-orm.packages=org.axonframework

quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=false

quarkus.datasource.devservices.init-script-path=db/migration/V1__axon_event_store_and_inbox.sql

quarkus.axon.axon-application-name=axonposts-tagging
quarkus.axon.update-check.disabled=true

quarkus.axon.subscribingprocessor.namespaces=dev.manuelantunes.axonposts.tagging.application
quarkus.axon.subscribingprocessor.name=tag-decision

quarkus.arc.exclude-types=at.meks.quarkiverse.axon.runtime.defaults.eventprocessors.PooledEventProcessingConfigurer

axonposts.messaging.publish-events=true

mp.messaging.outgoing.post-events-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.post-events-out.exchange.name=axonposts.events
mp.messaging.outgoing.post-events-out.exchange.type=topic
mp.messaging.outgoing.post-events-out.exchange.declare=true

mp.messaging.incoming.post-precreated-in.connector=smallrye-rabbitmq
mp.messaging.incoming.post-precreated-in.queue.name=axonposts.tagging.post-precreated
mp.messaging.incoming.post-precreated-in.queue.declare=true
mp.messaging.incoming.post-precreated-in.exchange.name=axonposts.events
mp.messaging.incoming.post-precreated-in.exchange.type=topic
mp.messaging.incoming.post-precreated-in.exchange.declare=true
mp.messaging.incoming.post-precreated-in.routing-keys=posts.PostPreCreated.*
mp.messaging.incoming.post-precreated-in.failure-strategy=reject

mp.messaging.incoming.post-changes-in.connector=smallrye-rabbitmq
mp.messaging.incoming.post-changes-in.queue.name=axonposts.tagging.post-changes
mp.messaging.incoming.post-changes-in.queue.declare=true
mp.messaging.incoming.post-changes-in.exchange.name=axonposts.events
mp.messaging.incoming.post-changes-in.exchange.type=topic
mp.messaging.incoming.post-changes-in.exchange.declare=true
mp.messaging.incoming.post-changes-in.routing-keys=posts.PostUpdated.*,posts.PostDeleted.*,posts.PostRestored.*
mp.messaging.incoming.post-changes-in.failure-strategy=reject

%prod.rabbitmq-host=${RABBITMQ_HOST:localhost}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USERNAME:guest}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD:guest}

quarkus.log.category."dev.manuelantunes.axonposts".level=DEBUG
quarkus.log.category."org.axonframework".level=INFO

quarkus.otel.logs.enabled=true
quarkus.otel.metrics.enabled=true

%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

quarkus.observability.lgtm.grafana-port=3001

%test.mp.messaging.incoming.post-precreated-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.post-changes-in.connector=smallrye-in-memory
%test.mp.messaging.outgoing.post-events-out.connector=smallrye-in-memory

%test.quarkus.observability.enabled=false
%test.quarkus.otel.sdk.disabled=true
