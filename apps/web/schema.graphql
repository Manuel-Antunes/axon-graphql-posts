schema @link(import : ["@key", "@shareable"], url : "https://specs.apollo.dev/federation/v2.7"){
  query: Query
  mutation: Mutation
  subscription: Subscription
}

"Indicates a Bean Validation constraint"
directive @constraint(format: String, max: BigInteger, maxFloat: BigDecimal, maxLength: Int, min: BigInteger, minFloat: BigDecimal, minLength: Int, pattern: String) repeatable on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

"This directive allows results to be deferred during execution"
directive @defer(
    "Deferred behaviour is controlled by this argument"
    if: Boolean! = true,
    "A unique label that represents the fragment being deferred"
    label: String
  ) on FRAGMENT_SPREAD | INLINE_FRAGMENT

"Marks the field, argument, input field or enum value as deprecated"
directive @deprecated(reason: String) on FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM_VALUE | INPUT_FIELD_DEFINITION

"This directive disables error propagation when a non nullable field returns null for the given operation."
directive @experimental_disableErrorPropagation on QUERY | MUTATION | SUBSCRIPTION

"Indicates to composition that the target element is accessible only to the authenticated supergraph users."
directive @federation__authenticated on SCALAR | OBJECT | FIELD_DEFINITION | INTERFACE | ENUM

"Indicates to composition that all uses of a particular custom type system directive in the subgraph schema should be preserved in the supergraph schema (by default, composition omits most directives from the supergraph schema)."
directive @federation__composeDirective(name: String!) repeatable on SCHEMA

"""
Indicates that an object or interface definition is an extension of another definition of that same type.
If your subgraph library supports GraphQL's built-in extend keyword, do not use this directive! Instead, use extend.
"""
directive @federation__extends on OBJECT | INTERFACE

"""
Indicates that this subgraph usually can't resolve a particular object field, but it still needs to define that field for other purposes.
This directive is always used in combination with another directive that references object fields, such as @provides or @requires.
"""
directive @federation__external on OBJECT | FIELD_DEFINITION

"Indicates that a definition in the subgraph schema should be omitted from the router's API schema, even if that definition is also present in other subgraphs. This means that the field is not exposed to clients at all."
directive @federation__inaccessible on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

"""
Indicates that an object definition serves as an abstraction of another subgraph's entity interface. This abstraction enables a subgraph to automatically contribute fields to all entities that implement a particular entity interface.
During composition, the fields of every @interfaceObject are added both to their corresponding interface definition and to all entity types that implement that interface.
"""
directive @federation__interfaceObject on OBJECT

"""
Indicates that an object field is now resolved by this subgraph instead of another subgraph where it's also defined. This enables you to migrate a field from one subgraph to another.
You can apply @override to entity fields and fields of the root operation types (such as Query and Mutation).
"""
directive @federation__override(from: String!, label: String) on FIELD_DEFINITION

"Indicates to composition that the target element is restricted based on authorization policies that are evaluated in a Rhai script or coprocessor."
directive @federation__policy(policies: [[federation__Policy!]!]!) on SCALAR | OBJECT | FIELD_DEFINITION | INTERFACE | ENUM

"""
Specifies a set of entity fields that a subgraph can resolve, but only at a particular schema path (at other paths, the subgraph can't resolve those fields).
If a subgraph can always resolve a particular entity field, do not apply this directive.
Using this directive is always an optional optimization. It can reduce the total number of subgraphs that your graph router needs to communicate with to resolve certain operations, which can improve performance.
"""
directive @federation__provides(fields: federation__FieldSet!) on FIELD_DEFINITION

"Indicates that the resolver for a particular entity field depends on the values of other entity fields that are resolved by other subgraphs. This tells the graph router that it needs to fetch the values of those externally defined fields first, even if the original client query didn't request them."
directive @federation__requires(fields: federation__FieldSet!) on FIELD_DEFINITION

"Indicates to composition that the target element is accessible only to the authenticated supergraph users with the appropriate JWT scopes"
directive @federation__requiresScopes(scopes: [[federation__Scope!]!]!) on SCALAR | OBJECT | FIELD_DEFINITION | INTERFACE | ENUM

"Applies arbitrary string metadata to a schema location. Custom tooling can use this metadata during any step of the schema delivery flow, including composition, static analysis, and documentation. Apollo Studio's enterprise contracts feature uses @tag with its inclusion and exclusion filters."
directive @federation__tag(name: String!) repeatable on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

"Directs the executor to include this field or fragment only when the `if` argument is true"
directive @include(
    "Included when true."
    if: Boolean!
  ) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT

"Designates an object type as an entity and specifies its key fields (a set of fields that the subgraph can use to uniquely identify any instance of the entity). You can apply multiple @key directives to a single entity (to specify multiple valid sets of key fields)."
directive @key(fields: federation__FieldSet!, resolvable: Boolean = true) repeatable on OBJECT | INTERFACE

"This directive links definitions from an external specification to this schema."
directive @link(as: String, for: link__Purpose, import: [link__Import], url: String!) repeatable on SCHEMA

"Indicates an Input Object is a OneOf Input Object."
directive @oneOf on INPUT_OBJECT

"Used to specify the role required to execute a given field or operation."
directive @rolesAllowed(value: String) on FIELD_DEFINITION

"Indicates that an object type's field is allowed to be resolved by multiple subgraphs (by default in Federation 2, object fields can be resolved by only one subgraph)."
directive @shareable repeatable on OBJECT | FIELD_DEFINITION

"Directs the executor to skip this field or fragment when the `if` argument is true."
directive @skip(
    "Skipped when true."
    if: Boolean!
  ) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT

"Exposes a URL that specifies the behaviour of this scalar."
directive @specifiedBy(
    "The URL that specifies the behaviour of this scalar."
    url: String!
  ) on SCALAR

"Whoever has an account. An interface because the domain hierarchy is polymorphic"
interface User @key(fields : "id") {
  "This user's credentials, one per provider"
  accounts: [Account]!
  email: String!
  id: ID!
  name: String!
}

union _Entity = Author | Post | Reader | Tag

"A credential. Identity in `users`, credential in `accounts`, one row per provider"
type Account {
  "Whether this account can sign in with a password. False for every federated account"
  hasPassword: Boolean!
  "ISO-8601"
  linkedAt: DateTime!
  provider: AuthProvider!
  "The account's identifier AT the provider (the token's `sub`). Not the e-mail"
  subject: String!
}

"A user who writes. A table-per-type subclass of User: a row in `users` + a row in `authors`"
type Author implements User @key(fields : "id") {
  accounts: [Account]!
  "A field only the subclass has, which is why it can be NOT NULL in `authors`"
  bio: String!
  email: String!
  id: ID!
  name: String!
  "This author's posts, newest first, as a Relay cursor connection"
  posts(
    "Cursor of the last post already seen; absent = from the start"
    after: String,
    "How many posts to fetch; absent = 20"
    first: Int
  ): PostConnection!
}

"Mutation root"
type Mutation {
  "Dispatches the CreatePost command and returns the already-projected Post"
  createPost(input: CreatePostInput!): Post! @rolesAllowed(value : "author")
  "Deletes your own account (logical deletion). Requires only being authenticated"
  deleteMe: Boolean!
  "Logical deletion: the post disappears from queries, but the row and the stream stay"
  deletePost(id: ID!): Boolean! @rolesAllowed(value : "author")
  "Undoes the logical deletion. It works because the aggregate is rehydrated from the events"
  restorePost(id: ID!): Post! @rolesAllowed(value : "author")
  "Dispatches the UpdatePost command and returns the already-projected Post"
  updatePost(input: UpdatePostInput!): Post! @rolesAllowed(value : "author")
}

type PageInfo @shareable {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

"A published post, with the state resulting from every event applied to it"
type Post @key(fields : "id") {
  "Who wrote it. Resolved in batch: N posts from M authors cost ONE query"
  author: Author!
  content: String!
  "ISO-8601"
  createdAt: DateTime!
  id: ID!
  "The post's tags, as a Relay cursor connection. Resolved in batch"
  tags(
    "Cursor of the last tag already seen; absent = from the start"
    after: String,
    "How many tags to fetch; absent = 20"
    first: Int
  ): TagConnection!
  title: String!
  "ISO-8601"
  updatedAt: DateTime!
  version: Int!
}

type PostConnection {
  "The items on this page, each with its position"
  edges: [PostEdge]!
  "Whether there is a next/previous page, and the cursors at this one's ends"
  pageInfo: PageInfo!
}

type PostEdge {
  "This item's opaque position; pass it back in `after` to continue from here"
  cursor: String!
  "The item at this position in the connection"
  node: Post!
}

"Query root"
type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
  "Who is signed in. Requires Authorization: Bearer <token issued by Keycloak>"
  me: User!
  "A Post by id; null if it does not exist"
  post(id: ID!): Post
  "Posts in creation order, as a Relay cursor connection"
  posts(
    "Cursor of the last post already seen; absent = from the start"
    after: String,
    "How many posts to fetch; absent = 20"
    first: Int
  ): PostConnection!
}

"A user who only reads. It is Java's `User` with no row in the `authors` table"
type Reader implements User @key(fields : "id") {
  accounts: [Account]!
  email: String!
  id: ID!
  name: String!
}

"Subscription root"
type Subscription {
  "Emits on every PostCreated. authorId filters by topic (null = all)"
  onPostCreated(authorId: ID): Post!
  "Emits on every PostUpdated. The two filters combine (AND); null in both = everything"
  onPostUpdated(authorId: ID, postId: ID): Post!
}

"A tag. An aggregate of its own: it has an id and an event stream independent of the post"
type Tag @key(fields : "id") {
  id: ID!
  name: String!
}

type TagConnection {
  "The items on this page, each with its position"
  edges: [TagEdge]!
  "Whether there is a next/previous page, and the cursors at this one's ends"
  pageInfo: PageInfo!
}

type TagEdge {
  "This item's opaque position; pass it back in `after` to continue from here"
  cursor: String!
  "The item at this position in the connection"
  node: Tag!
}

type _Service {
  sdl: String!
}

enum AuthProvider {
  COGNITO
  CREDENTIAL
  GITHUB
  GOOGLE
  KEYCLOAK
}

enum link__Purpose {
  "`EXECUTION` features provide metadata necessary for operation execution."
  EXECUTION
  "`SECURITY` features provide metadata necessary to securely resolve fields."
  SECURITY
}

"Scalar for BigDecimal"
scalar BigDecimal

"Scalar for BigInteger"
scalar BigInteger

"Scalar for DateTime"
scalar DateTime

scalar _Any

"Scalar for FieldSet"
scalar federation__FieldSet

"Scalar for Policy"
scalar federation__Policy

"Scalar for Scope"
scalar federation__Scope

"Scalar for Import"
scalar link__Import

input CreatePostInput {
  content: String!
  title: String! @constraint(maxLength : 200)
}

input UpdatePostInput {
  content: String @constraint(pattern : "(?s).*\\S.*")
  id: ID!
  title: String @constraint(pattern : ".*\\S.*") @constraint(maxLength : 200)
}
