services:
  postgres:
    image: postgres:17-alpine
    container_name: quarkus-axonposts-postgres
    environment:
      POSTGRES_DB: axonposts
      POSTGRES_USER: axonposts
      POSTGRES_PASSWORD: axonposts
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U axonposts -d axonposts']
      interval: 5s
      timeout: 5s
      retries: 20

  flyway-posts:
    image: flyway/flyway:11-alpine
    container_name: quarkus-axonposts-flyway-posts
    command:
      - -url=jdbc:postgresql://postgres:5432/axonposts
      - -user=axonposts
      - -password=axonposts
      - -locations=filesystem:/flyway/sql
      - -baselineOnMigrate=false
      - -connectRetries=20
      - migrate
    volumes:
      - ./apps/posts-api/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  flyway-tagging:
    image: flyway/flyway:11-alpine
    container_name: quarkus-axonposts-flyway-tagging
    command:
      - -url=jdbc:postgresql://postgres:5432/axonposts_tagging
      - -user=axonposts
      - -password=axonposts
      - -locations=filesystem:/flyway/sql
      - -baselineOnMigrate=false
      - -connectRetries=20
      - migrate
    volumes:
      - ./apps/tagging/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: quarkus-axonposts-keycloak
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '${KEYCLOAK_PORT:-8081}:8080'
    volumes:
      - ./docker/keycloak/realm-axon-posts.json:/opt/keycloak/data/import/realm-axon-posts.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: quarkus-axonposts-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 5s
      retries: 20

  router:
    image: ghcr.io/apollographql/router:v2.9.0
    container_name: quarkus-axonposts-router
    profiles: ['federation']
    command:
      [
        '--dev',
        '--config',
        '/etc/router/router.yaml',
        '--supergraph',
        '/etc/router/supergraph.graphql',
      ]
    ports:
      - '${ROUTER_PORT:-4000}:4000'
    volumes:
      - ./docker/federation/router.yaml:/etc/router/router.yaml:ro
      - ./docker/federation/supergraph.graphql:/etc/router/supergraph.graphql:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres-data:
