extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.7"
    import: ["@key", "@interfaceObject"]
  )

type Comment @key(fields: "id") {
  id: ID!
  body: String!
  post: Post!
}

type Post @key(fields: "id") {
  id: ID!
  comments: [Comment!]!
}

type User @key(fields: "id") @interfaceObject {
  id: ID!
  commentCount: Int!
}
