receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 'localhost:4317'
      http:
        endpoint: 'localhost:4318'

processors:
  decouple:

exporters:
  otlp_http/betterstack:
    endpoint: ${env:BETTER_STACK_URL}
    headers:
      Authorization: 'Bearer ${env:BETTER_STACK_API_KEY}'
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_elapsed_time: 30s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [decouple]
      exporters: [otlp_http/betterstack]
    metrics:
      receivers: [otlp]
      processors: [decouple]
      exporters: [otlp_http/betterstack]
    logs:
      receivers: [otlp]
      processors: [decouple]
      exporters: [otlp_http/betterstack]

  telemetry:
    metrics:
      level: none
