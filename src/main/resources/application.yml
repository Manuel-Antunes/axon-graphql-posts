spring:
  application:
    name: axon-graphql-posts

  # ---- Read model: PostgreSQL via Spring Data JPA (docker compose up -d) ---------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/axonposts}
    username: ${SPRING_DATASOURCE_USERNAME:axonposts}
    password: ${SPRING_DATASOURCE_PASSWORD:axonposts}
  jpa:
    # sem database-platform: o Hibernate reconhece o Postgres pela conexão. O dialeto do SQLite era o
    # único motivo de a propriedade existir
    hibernate:
      # validate, e não update: quem cria o schema é o Flyway. O Hibernate passa a CONFERIR que as
      # entidades e as migrations dizem a mesma coisa, e a aplicação não sobe se divergirem — um campo
      # novo sem migration vira erro na partida em vez de um ALTER TABLE silencioso em produção.
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  # ---- Migrations -----------------------------------------------------------------------
  flyway:
    # o default já é este; explícito porque é o diretório que passa a ser a verdade sobre o schema
    locations: classpath:db/migration
    # deliberadamente FALSE: um banco não-vazio sem histórico é um banco que alguém criou por fora, e
    # assumir uma baseline silenciosa esconderia justamente o problema que o Flyway existe para evitar.
    # Para o banco de desenvolvimento vindo do ddl-auto: docker compose down -v
    baseline-on-migrate: false

  # ---- Autenticação: resource server do realm do Keycloak ------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          # o Boot busca o /.well-known/openid-configuration deste issuer, descobre o JWKS e monta o
          # decoder sozinho — não há chave nem segredo neste projeto
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/axon-posts}

  # ---- Spring for GraphQL ----------------------------------------------------------------
  graphql:
    graphiql:
      enabled: true          # http://localhost:8080/graphiql
    websocket:
      path: /graphql         # só pro GraphiQL conseguir rodar subscriptions no browser
    http:
      sse:
        keep-alive: 15s      # ping periódico pra manter o stream SSE vivo atrás de proxies

  # ---- Axon 5: sem os autoconfigs JPA/JDBC (event store e token store em memória, nenhuma tabela do Axon no Postgres)
  autoconfigure:
    exclude:
      - org.axonframework.extension.springboot.autoconfig.JpaAutoConfiguration
      - org.axonframework.extension.springboot.autoconfig.JpaEventStoreAutoConfiguration
      - org.axonframework.extension.springboot.autoconfig.JdbcAutoConfiguration

axon:
  axonserver:
    enabled: false           # connector nem está no classpath; a flag é só documentação
  converter:
    general: jackson         # JacksonConverter (Jackson 3, que vem com o axon-conversion)
  # Alternativa por propriedade ao EventProcessorDefinition bean do AxonConfig:
  # eventhandling:
  #   processors:
  #     post-projection:
  #       mode: subscribing

logging:
  level:
    dev.manuelantunes.axonposts: DEBUG
    org.axonframework: INFO
