name: 'deploy'
description: 'O deploy da stack SST: prepara o ambiente, autentica na AWS e chama o `deploy-sst`'
inputs:
  stage:
    description: 'Stage de destino (dev, prod, stg etc.)'
    default: 'develop'
    required: true
  aws-region:
    description: 'A região. A stack é escrita para us-east-1 — o `infra/aws/README.md` diz por quê.'
    default: 'us-east-1'
    required: false
  aws-access-key-id:
    description: 'De `secrets.AWS_ACCESS_KEY_ID`. Uma action composta não enxerga secrets sozinha.'
    required: true
  aws-secret-access-key:
    description: 'De `secrets.AWS_SECRET_ACCESS_KEY`.'
    required: true
  better-stack-url:
    description: >
      De `secrets.BETTER_STACK_URL`. NÃO é opcional: `infra/aws/support/functions.ts` a lê com
      `requiredEnv` e FALHA o deploy se faltar — de propósito, porque um coletor sem destino sobe,
      não reclama, e some com a telemetria em silêncio. Na máquina ela vem do `.env` da raiz, que o
      SST carrega sozinho; num runner não há `.env`.
    required: true
  better-stack-api-key:
    description: 'De `secrets.BETTER_STACK_API_KEY`. Mesma história.'
    required: true
  args:
    description: 'Repassado ao `deploy-sst` — `--target`, `--exclude`, `--continue`, `--verbose`.'
    default: ''
    required: false
  upload_outputs:
    description: 'Repassado ao `deploy-sst`. Ver a advertência sobre credenciais em outputs lá.'
    default: 'true'
    required: false
runs:
  using: composite
  steps:
    - name: Set up the environment
      uses: ./tools/github/setup

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Export the telemetry destination
      run: |
        echo "BETTER_STACK_URL=$BETTER_STACK_URL" >> "$GITHUB_ENV"
        echo "BETTER_STACK_API_KEY=$BETTER_STACK_API_KEY" >> "$GITHUB_ENV"
      shell: bash
      env:
        BETTER_STACK_URL: ${{ inputs.better-stack-url }}
        BETTER_STACK_API_KEY: ${{ inputs.better-stack-api-key }}

    - name: Deploy
      uses: ./tools/github/deploy-sst
      with:
        stage: ${{ inputs.stage }}
        args: ${{ inputs.args }}
        upload_outputs: ${{ inputs.upload_outputs }}
