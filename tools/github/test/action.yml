name: 'test'
description: 'O nível de baixo da suíte: domínio, commands, fiação e schema em Java, mais os testes de unidade do cliente web'
inputs:
  upload_reports:
    description: 'Guardar os relatórios dos testes (Surefire e junit do Vitest) como artefato do run.'
    default: 'true'
    required: false
runs:
  using: composite
  steps:
    - name: Lint the Java reactor
      run: npx nx run "dev.manuelantunes:quarkus-axon-graphql-posts:lint"
      shell: bash

    - name: Run unit and wiring tests
      run: pnpm test
      shell: bash

    - name: Upload test reports
      if: ${{ always() && inputs.upload_reports == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports-test
        path: |
          apps/*/target/surefire-reports/**
          libs/**/target/surefire-reports/**
          apps/*/target/test-results/**
        if-no-files-found: ignore
        retention-days: 7
