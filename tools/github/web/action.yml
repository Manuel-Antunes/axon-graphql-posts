name: 'web'
description: 'As checagens ESTÁTICAS dos pacotes JavaScript, mais o build do cliente Next.js'
runs:
  using: composite
  steps:
    - name: Check formatting
      run: pnpm format:check
      shell: bash

    - name: Lint and typecheck every JavaScript project
      run: npx nx run-many -t lint typecheck -p web web-e2e infra
      shell: bash

    - name: Build the web client
      run: npx nx run web:build
      shell: bash
